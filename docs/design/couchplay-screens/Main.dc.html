<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>TV lobby</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 64px 96px; background: #14141E; color: #F4F4F8; font-family: Roboto, system-ui, sans-serif; display: grid; grid-template-columns: 560px minmax(0, 1fr); column-gap: 96px">
  <div style="display: flex; flex-direction: column; gap: 28px">
    <div style="font-size: 72px; font-weight: 900; letter-spacing: -1px">CouchPlay</div>
    <div style="width: 520px; height: 520px; background: #FFFFFF; border-radius: 24px; box-sizing: border-box; padding: 60px; display: flex">
      <div style="flex-grow: 1; border: 4px dashed #14141E; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #14141E; font-size: 36px; font-weight: 700; text-align: center">QR kod</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 40px; color: #A9A9BC">Skeniraj ili otvori u pregledniku:</div>
      <div style="font-size: 52px; font-weight: 700; white-space: nowrap">192.168.1.5:8080</div>
    </div>
    <div style="display: flex; gap: 24px; margin-top: auto">
      <button style="font: inherit; font-size: 40px; font-weight: 500; color: #F4F4F8; background: #2A2A3A; border: 0; border-radius: 16px; padding: 16px 32px; outline: 3px solid #4DD9FF; outline-offset: 4px">Kako se pridružiti</button>
      <button style="font: inherit; font-size: 40px; font-weight: 500; color: #F4F4F8; background: #2A2A3A; border: 0; border-radius: 16px; padding: 16px 32px">Izlaz</button>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 36px; min-width: 0">
    <div style="display: flex; flex-direction: column; gap: 20px">
      <div style="font-size: 44px; font-weight: 700">Igrači · 5 od 8</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px">
        <sc-for list="{{players}}" as="p" hint-placeholder-count="5">
          <div style="background: {{p.color}}; color: #14141E; border-radius: 999px; padding: 8px 28px 8px 8px; font-size: 44px; font-weight: 700; display: flex; align-items: center; gap: 16px; opacity: {{p.op}}">
            <span style="width: 76px; height: 76px; border-radius: 50%; background: #14141E; display: flex; align-items: center; justify-content: center">
              <dc-import name="Face" animal="{{p.animal}}" color="{{p.color}}" size="{{s68}}" hint-size="68px,68px"></dc-import>
            </span>
            <span style="flex-grow: 1">{{p.name}}</span>
            <sc-if value="{{p.hasTag}}" hint-placeholder-val="{{ true }}"><span style="font-size: 26px; font-weight: 700; background: #14141E; color: #F4F4F8; border-radius: 999px; padding: 6px 16px">{{p.tag}}</span></sc-if>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; gap: 36px; align-items: center; background: #1F1F2C; border: 3px solid #4DD9FF; border-radius: 32px; padding: 36px 44px">
      <svg viewBox="0 0 240 160" width="240" height="160" aria-hidden="true"><path d="M10 140 C60 30 110 150 160 60 S230 30 232 110" fill="none" stroke="#FF4D6D" stroke-width="10" stroke-linecap="round"></path><path d="M20 20 C90 90 130 10 200 50" fill="none" stroke="#2ECC71" stroke-width="10" stroke-linecap="round"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div style="font-size: 36px; color: #A9A9BC">Luka gleda:</div>
        <div style="font-size: 72px; font-weight: 900; line-height: 1">Curve</div>
        <div style="font-size: 40px">Način: <b>Kaos</b> · Pauza prije runde: <b>2 s</b></div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 14px; background: #1F1F2C; border-radius: 32px; padding: 28px 44px">
      <div style="font-size: 40px; font-weight: 700">Večeras</div>
      <div style="display: flex; gap: 40px; font-size: 40px">
        <span style="display: flex; align-items: center; gap: 12px"><dc-import name="Face" animal="owl" color="#FFB020" size="{{s48}}" hint-size="48px,48px"></dc-import>Ana <b>9</b></span>
        <span style="display: flex; align-items: center; gap: 12px"><dc-import name="Face" animal="fox" color="#FF4D6D" size="{{s48}}" hint-size="48px,48px"></dc-import>Luka <b>7</b></span>
        <span style="display: flex; align-items: center; gap: 12px"><dc-import name="Face" animal="rabbit" color="#22B8F0" size="{{s48}}" hint-size="48px,48px"></dc-import>Ivana <b>6</b></span>
      </div>
    </div>
    <div style="font-size: 40px; color: #A9A9BC; margin-top: auto">Igra počinje kad Luka pritisne Igraj.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const p = (animal, color, name, tag, op) => ({ animal, color, name, tag, hasTag: !!tag, op: op ?? 1 });
    return {
      s68: 68, s48: 48,
      players: [
        p('fox', '#FF4D6D', 'Luka', '★ DOMAĆIN'),
        p('owl', '#FFB020', 'Ana', ''),
        p('frog', '#2ECC71', 'Marko', 'NIJE TU', 0.6),
        p('rabbit', '#22B8F0', 'Ivana', ''),
        p('panda', '#9B5CFF', 'Robot 1', 'ROBOT')
      ]
    };
  }
}
</script>
</body>
</html>
