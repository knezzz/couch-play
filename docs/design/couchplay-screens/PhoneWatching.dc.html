<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Player lobby</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 32px; background: #14141E; color: #F4F4F8; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px">
  <div style="background: #FFB020; color: #14141E; border-radius: 20px; padding: 10px 16px; display: flex; align-items: center; gap: 12px">
    <dc-import name="Face" animal="owl" color="#FFFFFF" size="{{s44}}" hint-size="44px,44px"></dc-import>
    <span style="font-size: 26px; font-weight: 900; flex-grow: 1">Ana</span>
    <button style="font: inherit; font-size: 16px; font-weight: 700; color: #14141E; background: rgba(20,20,30,0.12); border: 0; border-radius: 12px; height: 44px; padding: 0 12px">Promijeni lik</button>
  </div>
  <div style="background: #1F1F2C; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 16px; color: #A9A9BC">Luka gleda:</div>
    <div style="font-size: 32px; font-weight: 900">Curve</div>
    <div style="font-size: 17px; color: #A9A9BC; line-height: 1.4">Način igre: Kaos · Pauza prije runde: 2 s</div>
  </div>
  <div style="font-size: 18px; font-weight: 700; color: #A9A9BC; margin-top: 8px">Igrači · 4</div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <sc-for list="{{players}}" as="p" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; height: 48px">
        <dc-import name="Face" animal="{{p.animal}}" color="{{p.color}}" size="{{s40}}" hint-size="40px,40px"></dc-import>
        <span style="font-size: 20px; flex-grow: 1">{{p.name}}</span>
        <span style="font-size: 14px; color: #A9A9BC">{{p.tag}}</span>
      </div>
    </sc-for>
  </div>
  <div style="font-size: 18px; color: #A9A9BC; text-align: center; margin-top: auto">Igra počinje kad Luka pritisne Igraj.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      s44: 44, s40: 40,
      players: [
        { animal: 'fox', color: '#FF4D6D', name: 'Luka', tag: '★ DOMAĆIN' },
        { animal: 'owl', color: '#FFB020', name: 'Ana (ti)', tag: '' },
        { animal: 'frog', color: '#2ECC71', name: 'Marko', tag: '' },
        { animal: 'panda', color: '#9B5CFF', name: 'Robot 1', tag: 'ROBOT' }
      ]
    };
  }
}
</script>
</body>
</html>
