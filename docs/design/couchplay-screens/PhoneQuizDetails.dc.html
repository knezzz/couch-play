<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Kviz details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 20px 32px; background: #14141E; color: #F4F4F8; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">
  <a href="PhoneCarousel.dc.html" style="align-self: flex-start; font-size: 18px; font-weight: 500; color: #4DD9FF; text-decoration: none; height: 44px; display: flex; align-items: center">‹ Natrag</a>
  <div style="background: #22B8F0; color: #14141E; border-radius: 24px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 34px; font-weight: 900">Kviz</div>
    <div style="font-size: 17px; line-height: 1.35">Pitanja s četiri odgovora. Odgovaraš na svom mobitelu.</div>
  </div>
  <div style="font-size: 16px; color: #A9A9BC; margin-top: 4px">Paket pitanja</div>
  <a href="PhonePacks.dc.html" style="display: flex; align-items: center; gap: 12px; background: #1F1F2C; border-radius: 16px; padding: 0 16px; height: 64px; color: #F4F4F8; text-decoration: none; margin-top: -6px">
    <span style="font-size: 20px; font-weight: 700; flex-grow: 1">Opće znanje</span>
    <span style="font-size: 16px; color: #A9A9BC">401 pitanje</span>
    <span style="font-size: 22px; color: #4DD9FF">›</span>
  </a>
  <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
    <div style="display: flex; align-items: center; gap: 10px; background: #1F1F2C; border-radius: 16px; padding: 8px 8px 8px 16px">
      <span style="font-size: 18px; flex-grow: 1">{{r.label}}</span>
      <button aria-label="{{r.less}}" style="font: inherit; font-size: 26px; font-weight: 700; color: #F4F4F8; background: #2A2A3A; border: 0; border-radius: 12px; width: 56px; height: 56px">−</button>
      <span style="font-size: 22px; font-weight: 700; width: 56px; text-align: center">{{r.value}}</span>
      <button aria-label="{{r.more}}" style="font: inherit; font-size: 26px; font-weight: 700; color: #F4F4F8; background: #2A2A3A; border: 0; border-radius: 12px; width: 56px; height: 56px">+</button>
    </div>
  </sc-for>
  <div style="font-size: 15px; color: #A9A9BC; line-height: 1.4">Postavke se vide na TV-u i vrijede od sljedeće igre. TV ih pamti.</div>
  <button style="font: inherit; font-size: 26px; font-weight: 900; color: #14141E; background: #4DD9FF; border: 0; border-radius: 18px; height: 72px; margin-top: auto">Igraj</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (label, value) => ({ label, value, less: 'Manje: ' + label, more: 'Više: ' + label });
    return { rows: [row('Vrijeme za odgovor', '20 s'), row('Broj pitanja', '10'), row('Pauza između pitanja', '4 s')] };
  }
}
</script>
</body>
</html>
