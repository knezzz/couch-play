<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Day vote</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 32px; background: linear-gradient(180deg, #2A1E2E 0%, #14141E 100%); color: #F4F4F8; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center">
    <span style="font-size: 16px; color: #E7B36A; letter-spacing: 3px; font-weight: 700; flex-grow: 1">DAN 3 · GLASANJE</span>
    <span style="font-size: 20px; font-weight: 700">0:12</span>
  </div>
  <div style="font-size: 30px; font-weight: 900">Koga izbacujete?</div>
  <div role="radiogroup" aria-label="Glas" style="display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{people}}" as="t" hint-placeholder-count="5">
      <button role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">
        <dc-import name="Face" animal="{{t.animal}}" color="{{t.color}}" size="{{s48}}" hint-size="48px,48px"></dc-import>
        <span style="font-size: 22px; font-weight: 700; flex-grow: 1; text-align: left">{{t.name}}</span>
        <span style="font-size: 16px; color: #A9A9BC">{{t.note}}</span>
      </button>
    </sc-for>
  </div>
  <button style="font: inherit; font-size: 20px; font-weight: 700; color: #A9A9BC; background: transparent; border: 2px solid #2A2A3A; border-radius: 14px; height: 52px">Preskoči glasanje</button>
  <button style="font: inherit; font-size: 22px; font-weight: 900; color: #14141E; background: #E7B36A; border: 0; border-radius: 16px; height: 64px; margin-top: auto">Glasaj</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pick: 'Petra' }; }
  renderVals() {
    const list = [['Luka', 'fox', '#FF4D6D', ''], ['Ana', 'owl', '#FFB020', 'ti'], ['Petra', 'cat', '#9B5CFF', ''], ['Josip', 'bear', '#FF7AD9', ''], ['Maja', 'mouse', '#F5E94B', '']];
    const people = list.map(([name, animal, color, note]) => {
      const on = this.state.pick === name, self = note === 'ti';
      return {
        name, animal, color, note, on: on ? 'true' : 'false',
        pick: () => { if (!self) this.setState({ pick: name }); },
        style: 'font: inherit; color: #F4F4F8; height: 64px; border-radius: 14px; display: flex; align-items: center; gap: 12px; padding: 0 12px; cursor: pointer; ' +
          (on ? 'background: rgba(231,179,106,0.2); border: 3px solid #E7B36A;' : 'background: rgba(255,255,255,0.05); border: 3px solid transparent;') + (self ? ' opacity: 0.5;' : '')
      };
    });
    return { people, s48: 48 };
  }
}
</script>
</body>
</html>
