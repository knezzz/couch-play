<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Your role</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 32px; background: #101014; color: #E8E8EE; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 10px">
    <span style="font-size: 20px; font-weight: 700; flex-grow: 1">Petra</span>
    <span style="font-size: 16px; color: #8A8A96">Noć 1</span>
  </div>
  <button aria-label="Drži za ulogu" onPointerDown="{{down}}" onPointerUp="{{up}}" onPointerLeave="{{up}}" style="flex-grow: 1; font: inherit; color: #E8E8EE; background: #18181E; border: 2px solid #26262E; border-radius: 28px; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; cursor: pointer; touch-action: none; user-select: none">
    <sc-if value="{{hidden}}" hint-placeholder-val="{{ true }}">
      <svg viewBox="0 0 100 100" width="96" height="96" aria-hidden="true"><path d="M30 64 Q30 30 50 30 Q70 30 70 64 M22 64 L78 64 L78 78 L22 78 Z" fill="none" stroke="#5A5A66" stroke-width="5" stroke-linejoin="round"></path><circle cx="50" cy="48" r="4" fill="#5A5A66"></circle></svg>
      <span style="font-size: 24px; font-weight: 700">Drži prst ovdje</span>
      <span style="font-size: 17px; color: #8A8A96; line-height: 1.4">Uloga se vidi samo dok držiš.<br>Pusti i nestaje.</span>
    </sc-if>
    <sc-if value="{{shown}}" hint-placeholder-val="{{ false }}">
      <span style="font-size: 15px; color: #8A8A96; letter-spacing: 3px; font-weight: 700">TVOJA ULOGA</span>
      <span style="font-size: 40px; font-weight: 900">{{role}}</span>
      <span style="font-size: 18px; line-height: 1.45; color: #B8B8C2">{{desc}}</span>
      <span style="font-size: 17px; color: #B8B8C2">{{extra}}</span>
    </sc-if>
  </button>
  <label style="display: flex; align-items: center; gap: 10px; font-size: 15px; color: #8A8A96">Pregled uloge:
    <select onChange="{{setRole}}" style="font: inherit; font-size: 15px; color: #E8E8EE; background: #18181E; border: 1px solid #26262E; border-radius: 8px; height: 36px">
      <option value="wolf">Vukodlak</option><option value="seer">Vidovnjakinja</option><option value="doc">Ljekarnik</option><option value="vil">Seljanin</option>
    </select>
  </label>
  <div style="font-size: 14px; color: #6E6E7A; text-align: center; line-height: 1.4">Svi vide isti sivi ekran, istog oblika i boje, bez obzira na ulogu.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { held: false, role: 'wolf' }; }
  renderVals() {
    const R = {
      wolf: ['Vukodlak', 'Svake noći s drugim vukodlakom biraš jednog seljana. Danju glumi da si jedan od njih.', 'Drugi vukodlak: Luka'],
      seer: ['Vidovnjakinja', 'Svake noći saznaš ulogu jednog igrača. Pazi kome to otkrivaš.', ''],
      doc: ['Ljekarnik', 'Svake noći štitiš jednog igrača. Ne možeš dvije noći zaredom isto.', ''],
      vil: ['Seljanin', 'Nemaš noćnu moć. Danju slušaj, pitaj i glasaj pametno.', '']
    };
    const r = R[this.state.role], h = this.state.held;
    return {
      hidden: !h, shown: h, role: r[0], desc: r[1], extra: r[2],
      down: () => this.setState({ held: true }), up: () => this.setState({ held: false }),
      setRole: (e) => this.setState({ role: e.target.value })
    };
  }
}
</script>
</body>
</html>
