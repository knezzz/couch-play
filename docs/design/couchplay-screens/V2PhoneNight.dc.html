<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Night action</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 32px; background: linear-gradient(180deg, #05060F 0%, #0C1430 100%); color: #F4F4F8; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">
  <div style="font-size: 16px; color: #8FA0D8; letter-spacing: 3px; font-weight: 700">NOĆ 2 · VUKODLACI</div>
  <div style="font-size: 30px; font-weight: 900; line-height: 1.15">Koga ćete noćas posjetiti?</div>
  <div style="font-size: 16px; color: #C3CBEA">Luka je odabrao: <b>Ivana</b>. Morate se složiti.</div>
  <div role="radiogroup" aria-label="Žrtva" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{targets}}" as="t" hint-placeholder-count="5">
      <button role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">
        <dc-import name="Face" animal="{{t.animal}}" color="{{t.color}}" size="{{s56}}" hint-size="56px,56px"></dc-import>
        <span style="font-size: 20px; font-weight: 700">{{t.name}}</span>
      </button>
    </sc-for>
  </div>
  <button style="font: inherit; font-size: 22px; font-weight: 900; color: #14141E; background: #FF4D6D; border: 0; border-radius: 16px; height: 64px; margin-top: auto">Potvrdi</button>
  <div style="font-size: 14px; color: #8FA0D8; text-align: center; line-height: 1.4">Seljani u isto vrijeme biraju koga sumnjiče, pa svi mobiteli izgledaju zauzeto.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pick: 'Ivana' }; }
  renderVals() {
    const list = [['Ana', 'owl', '#FFB020'], ['Ivana', 'rabbit', '#22B8F0'], ['Josip', 'bear', '#FF7AD9'], ['Maja', 'mouse', '#F5E94B'], ['Marko', 'frog', '#2ECC71']];
    const targets = list.map(([name, animal, color]) => {
      const on = this.state.pick === name;
      return {
        name, animal, color, on: on ? 'true' : 'false',
        pick: () => this.setState({ pick: name }),
        style: 'font: inherit; color: #F4F4F8; height: 76px; border-radius: 16px; display: flex; align-items: center; gap: 10px; padding: 0 10px; cursor: pointer; ' +
          (on ? 'background: rgba(255,77,109,0.22); border: 3px solid #FF4D6D;' : 'background: #1A1F3A; border: 3px solid transparent;')
      };
    });
    return { targets, s56: 56 };
  }
}
</script>
</body>
</html>
