<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Curve in play</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>

      <span style="display: flex; align-items: center; gap: 12px; font-size: 36px; opacity: {{p.op}}">
        <dc-import name="Face" animal="{{p.animal}}" color="{{p.color}}" size="{{s48}}" hint-size="48px,48px"></dc-import>
        <span>{{p.name}}</span><span style="font-weight: 900">{{p.score}}</span>
      </span>
    </sc-for>
    <span style="margin-left: auto; font-size: 32px; color: #A9A9BC">Kaos</span>
  </div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>

  renderVals() {
    return {
      s48: 48,
      players: [
        { animal: 'fox', color: '#FF4D6D', name: 'Luka', score: 12, op: 1 },
        { animal: 'owl', color: '#FFB020', name: 'Ana', score: 9, op: 1 },
