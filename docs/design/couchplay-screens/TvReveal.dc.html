<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV quiz reveal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 56px 96px 72px; background: #14141E; color: #F4F4F8; font-family: Roboto, system-ui, sans-serif; display: grid; grid-template-columns: minmax(0, 1fr) 520px; column-gap: 64px">
  <div style="display: flex; flex-direction: column; gap: 32px; min-width: 0">
    <div style="font-size: 40px; color: #A9A9BC"><span style="font-weight: 700; color: #F4F4F8">Question 3 of 10</span> · The answer is</div>
    <div style="font-size: 72px; font-weight: 900; line-height: 1.1; letter-spacing: -1px">Which country’s flag is this?</div>
    <div style="display: flex; flex-direction: column; gap: 20px; margin-top: auto">
      <div style="height: 168px; box-sizing: border-box; background: #FF4D6D; color: #14141E; border-radius: 24px; padding: 0 40px; display: flex; align-items: center; gap: 32px; outline: 6px solid #F4F4F8; outline-offset: 6px">
        <span style="font-size: 64px">▲</span><span style="font-size: 56px; font-weight: 900; flex-grow: 1">Japan</span>
        <span style="display: flex; gap: 12px"><span style="width: 48px; height: 48px; border-radius: 50%; background: #FFB020; box-shadow: 0 0 0 5px #FFFFFF"></span><span style="width: 48px; height: 48px; border-radius: 50%; background: #FF4D6D; box-shadow: 0 0 0 5px #FFFFFF"></span></span>
        <span style="font-size: 44px; font-weight: 900">✓</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
        <div style="height: 120px; box-sizing: border-box; background: rgba(34, 184, 240, 0.25); color: #F4F4F8; border-radius: 20px; padding: 0 28px; display: flex; align-items: center; gap: 20px"><span style="font-size: 44px; color: #22B8F0">◆</span><span style="font-size: 40px; font-weight: 500; flex-grow: 1">Bangladesh</span><span style="width: 44px; height: 44px; border-radius: 50%; background: #22B8F0; box-shadow: 0 0 0 5px #FFFFFF"></span></div>
        <div style="height: 120px; box-sizing: border-box; background: rgba(255, 176, 32, 0.25); color: #F4F4F8; border-radius: 20px; padding: 0 28px; display: flex; align-items: center; gap: 20px"><span style="font-size: 44px; color: #FFB020">●</span><span style="font-size: 40px; font-weight: 500; flex-grow: 1">Palau</span></div>
        <div style="height: 120px; box-sizing: border-box; background: rgba(46, 204, 113, 0.25); color: #F4F4F8; border-radius: 20px; padding: 0 28px; display: flex; align-items: center; gap: 20px"><span style="font-size: 44px; color: #2ECC71">■</span><span style="font-size: 40px; font-weight: 500; flex-grow: 1">South Korea</span><span style="width: 44px; height: 44px; border-radius: 50%; background: #9B5CFF; box-shadow: 0 0 0 5px #FFFFFF"></span></div>
      </div>
    </div>
  </div>
  <div style="background: #1F1F2C; border-radius: 32px; padding: 40px; display: flex; flex-direction: column; gap: 24px">
    <div style="font-size: 44px; font-weight: 700">Scores</div>
    <div style="display: flex; align-items: center; gap: 20px; font-size: 40px"><span style="width: 40px; height: 40px; border-radius: 50%; background: #FFB020"></span><span style="flex-grow: 1">Ana</span><span style="font-weight: 700">2 710</span></div>
    <div style="font-size: 32px; color: #2ECC71; margin: -16px 0 0 60px; font-weight: 700">+960</div>
    <div style="display: flex; align-items: center; gap: 20px; font-size: 40px"><span style="width: 40px; height: 40px; border-radius: 50%; background: #FF4D6D"></span><span style="flex-grow: 1">Luka</span><span style="font-weight: 700">2 480</span></div>
    <div style="font-size: 32px; color: #2ECC71; margin: -16px 0 0 60px; font-weight: 700">+771</div>
    <div style="display: flex; align-items: center; gap: 20px; font-size: 40px"><span style="width: 40px; height: 40px; border-radius: 50%; background: #9B5CFF"></span><span style="flex-grow: 1">Ivana</span><span style="font-weight: 700">1 650</span></div>
    <div style="font-size: 32px; color: #A9A9BC; margin: -16px 0 0 60px">+0</div>
    <div style="display: flex; align-items: center; gap: 20px; font-size: 40px"><span style="width: 40px; height: 40px; border-radius: 50%; background: #22B8F0"></span><span style="flex-grow: 1">Marko</span><span style="font-weight: 700">980</span></div>
    <div style="font-size: 32px; color: #A9A9BC; margin: -16px 0 0 60px">+0</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
