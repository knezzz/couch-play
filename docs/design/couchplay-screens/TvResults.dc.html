<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>

  </div>
  <div style="position: relative; display: flex; align-items: baseline; gap: 32px">
    <div style="font-size: 96px; font-weight: 900; letter-spacing: -2px">Ana wins!</div>
    <div style="font-size: 44px; color: #A9A9BC">Quiz · World Flags</div>
  </div>
  <div style="position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 560px; column-gap: 64px; flex-grow: 1">
    <div style="display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; align-items: center; gap: 28px; background: #FFB020; color: #14141E; border-radius: 28px; padding: 28px 40px; font-size: 56px; font-weight: 900"><span style="width: 80px">1st</span><span style="flex-grow: 1">Ana</span><span style="font-size: 44px">8 420</span><span style="font-size: 44px; background: #14141E; color: #F4F4F8; border-radius: 999px; padding: 8px 24px">+4</span></div>
      <div style="display: flex; align-items: center; gap: 28px; background: #1F1F2C; border-radius: 24px; padding: 24px 40px; font-size: 48px; font-weight: 700"><span style="width: 80px; color: #A9A9BC">2nd</span><span style="width: 40px; height: 40px; border-radius: 50%; background: #FF4D6D"></span><span style="flex-grow: 1">Luka</span><span style="font-size: 40px">7 910</span><span style="font-size: 40px; color: #2ECC71">+3</span></div>
      <div style="display: flex; align-items: center; gap: 28px; background: #1F1F2C; border-radius: 24px; padding: 24px 40px; font-size: 48px; font-weight: 700"><span style="width: 80px; color: #A9A9BC">3rd</span><span style="width: 40px; height: 40px; border-radius: 50%; background: #9B5CFF"></span><span style="flex-grow: 1">Ivana</span><span style="font-size: 40px">5 200</span><span style="font-size: 40px; color: #2ECC71">+2</span></div>
      <div style="display: flex; align-items: center; gap: 28px; background: #1F1F2C; border-radius: 24px; padding: 24px 40px; font-size: 48px; font-weight: 700"><span style="width: 80px; color: #A9A9BC">4th</span><span style="width: 40px; height: 40px; border-radius: 50%; background: #22B8F0"></span><span style="flex-grow: 1">Marko</span><span style="font-size: 40px">2 960</span><span style="font-size: 40px; color: #2ECC71">+1</span></div>
    </div>
    <div style="background: #1F1F2C; border-radius: 32px; padding: 40px; display: flex; flex-direction: column; gap: 20px">
      <div style="font-size: 44px; font-weight: 700">Tonight</div>
      <div style="display: flex; align-items: center; gap: 20px; font-size: 40px"><span style="width: 40px; height: 40px; border-radius: 50%; background: #FFB020"></span><span style="flex-grow: 1">Ana</span><span style="font-weight: 700">13</span></div>
      <div style="display: flex; align-items: center; gap: 20px; font-size: 40px"><span style="width: 40px; height: 40px; border-radius: 50%; background: #FF4D6D"></span><span style="flex-grow: 1">Luka</span><span style="font-weight: 700">10</span></div>

      <div style="display: flex; align-items: center; gap: 20px; font-size: 40px"><span style="width: 40px; height: 40px; border-radius: 50%; background: #22B8F0"></span><span style="flex-grow: 1">Marko</span><span style="font-weight: 700">3</span></div>
    </div>
  </div>
  <div style="position: relative; display: flex; align-items: center; gap: 24px; font-size: 40px; color: #A9A9BC">
    <div style="width: 360px; height: 12px; background: #2A2A3A; border-radius: 999px"><div style="width: 40%; height: 12px; background: #4DD9FF; border-radius: 999px"></div></div>
    <span>Back to the lobby in 5 s</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
