<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Curve details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 20px 32px; background: #14141E; color: #F4F4F8; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px">
  <a href="PhoneCarousel.dc.html" style="align-self: flex-start; font-size: 18px; font-weight: 500; color: #4DD9FF; text-decoration: none; height: 44px; display: flex; align-items: center">‹ Natrag</a>
  <div style="background: #1F1F2C; border: 3px solid #2A2A3A; border-radius: 24px; padding: 16px 20px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 34px; font-weight: 900">Curve</div>
    <div style="font-size: 17px; line-height: 1.35; color: #A9A9BC">Vozi svoju krivulju i ne udari u druge.</div>
  </div>
  <div style="font-size: 16px; color: #A9A9BC; margin-top: 4px">Način igre</div>
  <div role="radiogroup" aria-label="Način igre" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: -4px">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="4">
      <button role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="{{m.style}}">
        <span style="font-size: 20px; font-weight: 700">{{m.name}}</span>
        <span style="font-size: 14px; line-height: 1.3; opacity: 0.85">{{m.blurb}}</span>
      </button>
    </sc-for>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; background: #1F1F2C; border-radius: 16px; padding: 8px 8px 8px 16px">
    <span style="font-size: 18px; flex-grow: 1">Pauza prije runde</span>
    <button aria-label="Manje: Pauza prije runde" style="font: inherit; font-size: 26px; font-weight: 700; color: #F4F4F8; background: #2A2A3A; border: 0; border-radius: 12px; width: 56px; height: 56px">−</button>
    <span style="font-size: 22px; font-weight: 700; width: 48px; text-align: center">2 s</span>
    <button aria-label="Više: Pauza prije runde" style="font: inherit; font-size: 26px; font-weight: 700; color: #F4F4F8; background: #2A2A3A; border: 0; border-radius: 12px; width: 56px; height: 56px">+</button>
  </div>
  <div style="font-size: 15px; color: #A9A9BC; line-height: 1.4">Postavke se vide na TV-u i vrijede od sljedeće igre. TV ih pamti.</div>
  <button style="font: inherit; font-size: 26px; font-weight: 900; color: #14141E; background: #4DD9FF; border: 0; border-radius: 18px; height: 72px; margin-top: auto">Igraj</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { mode: 'balanced' }; }
  renderVals() {
    const list = [
      ['chaos', 'Kaos', 'Puno pojačanja, sve odjednom'],
      ['balanced', 'Uravnoteženo', 'Kao do sada'],
      ['peaceful', 'Mirno', 'Bez pojačanja'],
      ['onlyYou', 'Samo za tebe', 'Samo zelena: usporavanje i duh']
    ];
    const modes = list.map(([id, name, blurb]) => {
      const on = this.state.mode === id;
      return {
        name, blurb, on: on ? 'true' : 'false',
        pick: () => this.setState({ mode: id }),
        style: 'font: inherit; text-align: left; min-height: 92px; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; ' +
          (on ? 'background: #4DD9FF; color: #14141E; border: 0;' : 'background: #1F1F2C; color: #F4F4F8; border: 2px solid #2A2A3A;')
      };
    });
    return { modes };
  }
}
</script>
</body>
</html>
