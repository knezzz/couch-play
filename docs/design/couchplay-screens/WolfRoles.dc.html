<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Vukodlak roles (component)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 350px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; color: #F4F4F8; font-family: Roboto, system-ui, sans-serif">
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
    <div style="font-size: 15px; font-weight: 700; letter-spacing: 2px; color: {{g.color}}; margin-top: 8px">{{g.title}}</div>
    <sc-for list="{{g.roles}}" as="r" hint-placeholder-count="4">
      <button role="switch" aria-checked="{{r.on}}" onClick="{{r.toggle}}" disabled="{{r.locked}}" style="{{r.row}}">
        <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; text-align: left">
          <span style="font-size: 19px; font-weight: 700">{{r.name}}</span>
          <span style="font-size: 14px; color: #A9A9BC; line-height: 1.35">{{r.desc}}</span>
        </span>
        <sc-if value="{{edit}}" hint-placeholder-val="{{ true }}">
          <span style="{{r.track}}"><span style="{{r.knob}}"></span></span>
        </sc-if>
      </button>
    </sc-for>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["edit","view"],"default":"edit"},"enabled":{"editor":null},"onChange":{"editor":null},"$preview":{"width":350,"height":1300}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { enabled: null }; }
  renderVals() {
    const ALL = [
      ['VUKODLACI', '#FF7A8F', [
        ['wolf', 'Vukodlak', 'Noću s ostalim vukodlacima bira jednu žrtvu. Danju glumi seljana.', true],
        ['alpha', 'Vođa čopora', 'Vukodlak. Jednom u igri može žrtvu pretvoriti u vukodlaka umjesto da je ubije.'],
        ['lone', 'Vuk samotnjak', 'Ubija s čoporom, ali pobjeđuje samo ako ostane zadnji živ.']
      ]],
      ['SELO', '#7FD8A8', [
        ['vil', 'Seljanin', 'Nema noćnu moć. Danju sluša, pita i glasa.', true],
        ['seer', 'Vidovnjakinja', 'Svake noći sazna ulogu jednog igrača.'],
        ['doc', 'Ljekarnik', 'Svake noći štiti jednog igrača od vukodlaka. Ne isti dvije noći zaredom.'],
        ['guard', 'Tjelohranitelj', 'Čuva jednog igrača. Ako ga vukodlaci napadnu, strada tjelohranitelj umjesto njega.'],
        ['herb', 'Travarica', 'Ima jedan lijek (spašava žrtvu noći) i jedan otrov (ubija nekoga). Svaki jednom u igri.'],
        ['hunter', 'Lovac', 'Kad ispadne, odmah izbacuje još jednog igrača po izboru.'],
        ['elder', 'Starješina', 'Preživi prvi napad vukodlaka.'],
        ['mayor', 'Načelnik', 'Glas mu se broji dvostruko. Ako je izjednačeno, on odlučuje.'],
        ['cupid', 'Provodadžija', 'Prve noći spoji dvoje zaljubljenih. Ako jedno ispadne, ispada i drugo.'],
        ['fool', 'Seoska budala', 'Ako ga selo izglasa, ostaje u igri, ali više ne smije glasati.']
      ]],
      ['SAMI ZA SEBE', '#E7B36A', [
        ['tramp', 'Lutalica', 'Pobjeđuje sam ako ga selo izglasa van.']
      ]]
    ];
    const def = { wolf: 1, vil: 1, seer: 1, doc: 1, hunter: 1, herb: 1 };
    const en = this.props.enabled || this.state.enabled || def;
    const edit = (this.props.mode ?? 'edit') === 'edit';
    const flip = (k) => { const e = { ...en, [k]: en[k] ? 0 : 1 }; this.setState({ enabled: e }); this.props.onChange && this.props.onChange(e); };
    const groups = ALL.map(([title, color, rs]) => ({
      title, color,
      roles: rs.filter(([k]) => edit || en[k]).map(([k, name, desc, always]) => {
        const on = !!en[k] || !!always;
        return {
          name, desc: always && edit ? desc + ' (uvijek u igri)' : desc, on: on ? 'true' : 'false', locked: !!always,
          toggle: () => { if (!always) flip(k); },
          row: 'font: inherit; color: #F4F4F8; background: #1F1F2C; border: 0; border-radius: 14px; padding: 10px 12px 10px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; ' + (edit && !on ? 'opacity: 0.55;' : ''),
          track: `flex: 0 0 52px; height: 30px; border-radius: 15px; background: ${on ? '#4DD9FF' : '#2A2A3A'}; display: flex; align-items: center; padding: 3px; box-sizing: border-box; justify-content: ${on ? 'flex-end' : 'flex-start'}; opacity: ${always ? 0.5 : 1}`,
          knob: `width: 24px; height: 24px; border-radius: 50%; background: ${on ? '#14141E' : '#A9A9BC'}`
        };
      })
    })).filter((g) => g.roles.length);
    return { groups, edit };
  }
}
</script>
</body>
</html>
