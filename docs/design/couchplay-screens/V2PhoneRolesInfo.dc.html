<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Possible roles, for players</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 0 24px; background: #14141E; color: #F4F4F8; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column; gap: 8px">
  <div style="margin: 0 20px; font-size: 18px; color: #4DD9FF; height: 40px; display: flex; align-items: center">‹ Natrag</div>
  <div style="margin: 0 20px; font-size: 28px; font-weight: 900">Uloge u ovoj igri</div>
  <div style="margin: 0 20px; background: #1F1F2C; border-radius: 14px; padding: 12px 14px; font-size: 15px; line-height: 1.45; color: #C9C9D8"><b style="color: #F4F4F8">2 vukodlaka</b> i do 3 posebne uloge s ovog popisa. Ne mora svaka biti u igri. Ostali su Seljani. Svi vide isti popis.</div>
  <div style="flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 0 20px">
    <dc-import name="WolfRoles" mode="view" enabled="{{enabled}}" hint-size="350px,800px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { enabled: { wolf: 1, vil: 1, seer: 1, doc: 1, hunter: 1, herb: 1 } }; }
}
</script>
</body>
</html>
