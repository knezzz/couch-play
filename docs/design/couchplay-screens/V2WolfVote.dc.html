<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Vukodlak vote</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: linear-gradient(180deg, #2A1E2E 0%, #14141E 100%); color: #F4F4F8; font-family: Roboto, system-ui, sans-serif">
  <div style="position: absolute; left: 96px; top: 72px; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 36px; color: #E7B36A; font-weight: 700; letter-spacing: 4px">DAN 3 · GLASANJE</div>
    <div style="font-size: 80px; font-weight: 900">Koga selo izbacuje?</div>
  </div>
  <div style="position: absolute; right: 96px; top: 96px; font-size: 40px; color: #A9A9BC">Glasalo 4 od 5 · 0:12</div>
  <div style="position: absolute; left: 96px; right: 96px; top: 300px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 28px">
    <sc-for list="{{players}}" as="p" hint-placeholder-count="5">
      <div style="{{p.card}}">
        <dc-import name="Face" animal="{{p.animal}}" color="{{p.color}}" size="{{s160}}" hint-size="160px,160px"></dc-import>
        <div style="font-size: 44px; font-weight: 900">{{p.name}}</div>
        <div style="display: flex; gap: 8px; min-height: 48px; flex-wrap: wrap; justify-content: center">
          <sc-for list="{{p.voters}}" as="v" hint-placeholder-count="2">
            <dc-import name="Face" animal="{{v.animal}}" color="{{v.color}}" size="{{s48}}" hint-size="48px,48px"></dc-import>
          </sc-for>
        </div>
        <div style="font-size: 64px; font-weight: 900; color: {{p.countColor}}">{{p.count}}</div>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; left: 96px; right: 96px; bottom: 72px; background: rgba(255,77,109,0.14); border: 3px solid #FF4D6D; border-radius: 28px; padding: 28px 40px; display: flex; align-items: center; gap: 32px">
    <span style="font-size: 52px; font-weight: 900">Selo je izbacilo Petru.</span>
    <span style="font-size: 44px; color: #E7B36A">Petra je bila <b style="color: #FF4D6D">Vukodlak</b>.</span>
    <span style="margin-left: auto; font-size: 36px; color: #A9A9BC">Ostao je još 1 vukodlak.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const F = { Luka: ['fox', '#FF4D6D'], Ana: ['owl', '#FFB020'], Petra: ['cat', '#9B5CFF'], Josip: ['bear', '#FF7AD9'], Maja: ['mouse', '#F5E94B'] };
    const v = (n) => ({ animal: F[n][0], color: F[n][1] });
    const votes = { Luka: [], Ana: ['Petra'], Petra: ['Luka', 'Ana', 'Maja'], Josip: [], Maja: [] };
    const players = Object.keys(F).map((n) => {
      const top = n === 'Petra';
      return {
        name: n, animal: F[n][0], color: F[n][1], voters: votes[n].map(v), count: votes[n].length,
        countColor: top ? '#FF4D6D' : '#A9A9BC',
        card: 'display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 32px 16px; border-radius: 32px; ' + (top ? 'background: rgba(255,77,109,0.12); outline: 4px solid #FF4D6D;' : 'background: rgba(255,255,255,0.05);')
      };
    });
    return { players, s160: 160, s48: 48 };
  }
}
</script>
</body>
</html>
