<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Console home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: {{bg}}; color: #F4F4F8; font-family: Roboto, system-ui, sans-serif">
  <svg style="position: absolute; left: 0; top: 0" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true">
    <sc-if value="{{isCurve}}" hint-placeholder-val="{{ true }}">
      <path d="M-40 180 C300 120 520 300 820 220 S1320 80 1560 200 L1640 240" fill="none" stroke="#2ECC71" stroke-width="44" stroke-linecap="round" opacity="0.45"></path>
      <path d="M-40 760 C260 640 520 860 820 740 S1300 600 1560 720" fill="none" stroke="#FF4D6D" stroke-width="44" stroke-linecap="round" opacity="0.55"></path>
      <path d="M1700 1120 C1760 900 1660 760 1820 560 S1960 360 1880 300" fill="none" stroke="#22B8F0" stroke-width="44" stroke-linecap="round" opacity="0.4"></path>
      <path d="M-40 1000 C200 940 420 1040 640 960" fill="none" stroke="#FFB020" stroke-width="44" stroke-linecap="round" opacity="0.4" stroke-dasharray="260 70"></path>
    </sc-if>
    <sc-if value="{{isQuiz}}" hint-placeholder-val="{{ false }}">
      <rect x="120" y="120" width="420" height="420" rx="60" fill="#FF4D6D" opacity="0.45" transform="rotate(-12 330 330)"></rect>
      <rect x="1380" y="80" width="420" height="420" rx="60" fill="#22B8F0" opacity="0.45" transform="rotate(10 1590 290)"></rect>
      <rect x="1360" y="620" width="420" height="420" rx="60" fill="#2ECC71" opacity="0.4" transform="rotate(-8 1570 830)"></rect>
      <rect x="140" y="620" width="420" height="420" rx="60" fill="#FFB020" opacity="0.4" transform="rotate(14 350 830)"></rect>
    </sc-if>
    <sc-if value="{{isWolf}}" hint-placeholder-val="{{ false }}">
      <circle cx="1460" cy="300" r="220" fill="#F2E9C9" opacity="0.85"></circle>
      <path d="M0 820 L160 720 L260 780 L380 680 L520 770 L680 700 L820 790 L980 690 L1140 780 L1300 700 L1460 790 L1620 720 L1780 780 L1920 720 L1920 1080 L0 1080 Z" fill="#05060F"></path>
    </sc-if>
    <rect x="0" y="0" width="1920" height="1080" fill="url(#shade)"></rect>
    <defs><radialGradient id="shade" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#000000" stop-opacity="0.15"></stop><stop offset="100%" stop-color="#000000" stop-opacity="0.75"></stop></radialGradient></defs>
  </svg>
  <button aria-label="{{prevName}}" onClick="{{prev}}" style="position: absolute; left: -80px; top: 440px; width: 300px; height: 200px; border: 0; border-radius: 32px; background: rgba(255,255,255,0.07); color: #F4F4F8; font: inherit; font-size: 48px; font-weight: 900; opacity: 0.5; text-align: right; padding-right: 32px; cursor: pointer">{{prevName}}</button>
  <button aria-label="{{nextName}}" onClick="{{next}}" style="position: absolute; right: -80px; top: 440px; width: 300px; height: 200px; border: 0; border-radius: 32px; background: rgba(255,255,255,0.07); color: #F4F4F8; font: inherit; font-size: 48px; font-weight: 900; opacity: 0.5; text-align: left; padding-left: 32px; cursor: pointer">{{nextName}}</button>
  <div style="position: absolute; left: 0; right: 0; top: 360px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center">
    <div style="font-size: 200px; font-weight: 900; letter-spacing: -4px; line-height: 1; text-shadow: 0 8px 40px rgba(0,0,0,0.6)">{{title}}</div>
    <div style="font-size: 44px; color: #E6E6F0; text-shadow: 0 2px 12px rgba(0,0,0,0.7)">{{blurb}}</div>
    <div style="font-size: 34px; color: #C9C9D8">{{meta}}</div>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 820px; display: flex; justify-content: center; gap: 14px" aria-hidden="true">
    <sc-for list="{{dots}}" as="d" hint-placeholder-count="3"><span style="{{d.s}}"></span></sc-for>
  </div>
  <div style="position: absolute; left: 48px; top: 40px; display: flex; align-items: center; gap: 20px; background: rgba(0,0,0,0.5); border-radius: 24px; padding: 14px 28px 14px 14px">
    <div style="width: 168px; height: 168px; background: #FFFFFF; border-radius: 14px; box-sizing: border-box; padding: 14px; display: flex">
      <div style="flex-grow: 1; border: 3px dashed #14141E; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #14141E; font-size: 22px; font-weight: 700">QR</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 34px; font-weight: 900">Skeniraj i pridruži se</span>
      <span style="font-size: 28px; color: #C9C9D8">ili otvori u pregledniku:</span>
      <span style="font-size: 34px; font-weight: 700">192.168.1.5:8080</span>
    </div>
  </div>
  <div style="position: absolute; right: 72px; top: 48px; display: flex; align-items: center; gap: 14px">
    <sc-for list="{{players}}" as="p" hint-placeholder-count="5">
      <dc-import name="Face" animal="{{p.animal}}" color="{{p.color}}" size="{{s52}}" hint-size="52px,52px"></dc-import>
    </sc-for>
    <span style="font-size: 30px; color: #C9C9D8; margin-left: 6px">5 igrača</span>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 52px; text-align: center; font-size: 36px; font-weight: 900; opacity: 0.75; pointer-events: none">CouchPlay</div>
  <div style="position: absolute; left: 0; right: 0; bottom: 44px; display: flex; justify-content: center; gap: 48px; font-size: 30px; color: #C9C9D8">
    <span>◀ ▶ igra</span><span>OK igraj</span><span>▼ postavke</span><span>Natrag izlaz</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { i: 0 }; }
  renderVals() {
    const games = [
      { id: 'c', title: 'Curve', blurb: 'Vozi svoju krivulju i ne udari ni u koga.', meta: '2–8 igrača · Kaos · pauza 2 s', bg: 'linear-gradient(160deg, #0B0B18, #1A1236)' },
      { id: 'q', title: 'Kviz', blurb: '16 paketa, 2 000 pitanja. Odgovaraš na mobitelu.', meta: '1–8 igrača · Opće znanje · 10 pitanja · 20 s', bg: 'linear-gradient(160deg, #0E1A2E, #132744)' },
      { id: 'w', title: 'Vukodlak', blurb: 'Netko u selu nije ono što se čini.', meta: '5–8 igrača · bez robota', bg: 'linear-gradient(180deg, #05060F, #101A3A)' }
    ];
    const n = games.length, i = this.state.i, g = games[i];
    return {
      ...g, isCurve: g.id === 'c', isQuiz: g.id === 'q', isWolf: g.id === 'w',
      prevName: games[(i + n - 1) % n].title, nextName: games[(i + 1) % n].title,
      prev: () => this.setState({ i: (i + n - 1) % n }), next: () => this.setState({ i: (i + 1) % n }),
      dots: games.map((_, k) => ({ s: `width: ${k === i ? 40 : 14}px; height: 14px; border-radius: 7px; background: ${k === i ? '#F4F4F8' : 'rgba(255,255,255,0.35)'}` })),
      s52: 52,
      players: [
        { animal: 'fox', color: '#FF4D6D' }, { animal: 'owl', color: '#FFB020' }, { animal: 'frog', color: '#2ECC71' },
        { animal: 'rabbit', color: '#22B8F0' }, { animal: 'panda', color: '#9B5CFF' }
      ]
    };
  }
}
</script>
</body>
</html>
