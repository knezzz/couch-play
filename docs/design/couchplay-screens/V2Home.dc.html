<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Console home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: linear-gradient(160deg, #0B0B18 0%, #161232 55%, #0B0B18 100%); color: #F4F4F8; font-family: Roboto, system-ui, sans-serif">
  <svg style="position: absolute; left: 0; top: 0" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true">
    <path d="M0 700 C320 600 640 820 960 720 S1600 560 1920 680 L1920 1080 L0 1080 Z" fill="{{wave1}}" opacity="0.10"></path>
    <path d="M0 780 C360 700 700 900 1040 800 S1640 680 1920 760 L1920 1080 L0 1080 Z" fill="{{wave2}}" opacity="0.08"></path>
    <path d="M0 640 C400 560 760 760 1100 660 S1680 520 1920 600" fill="none" stroke="{{wave1}}" stroke-width="2" opacity="0.35"></path>
  </svg>
  <div style="position: absolute; left: 96px; right: 96px; top: 56px; display: flex; align-items: center; gap: 24px">
    <span style="font-size: 44px; font-weight: 900; letter-spacing: -0.5px">CouchPlay</span>
    <span style="flex-grow: 1"></span>
    <sc-for list="{{players}}" as="p" hint-placeholder-count="5">
      <dc-import name="Face" animal="{{p.animal}}" color="{{p.color}}" size="{{s56}}" hint-size="56px,56px"></dc-import>
    </sc-for>
    <span style="font-size: 36px; color: #A9A9BC; margin-left: 8px">5 igrača</span>
    <div style="display: flex; align-items: center; gap: 16px; background: rgba(255,255,255,0.06); border-radius: 18px; padding: 10px 18px 10px 10px; margin-left: 16px">
      <div style="width: 96px; height: 96px; background: #FFFFFF; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #14141E; font-size: 18px; font-weight: 700">QR</div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 26px; color: #A9A9BC">Pridruži se</span>
        <span style="font-size: 30px; font-weight: 700">192.168.1.5:8080</span>
      </div>
    </div>
  </div>
  <div style="position: absolute; left: 96px; top: 250px; display: flex; align-items: flex-end; gap: 48px">
    <sc-for list="{{games}}" as="g" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 18px; align-items: flex-start; opacity: {{g.op}}">
        <div style="{{g.tile}}">
          <svg viewBox="0 0 200 200" width="{{g.art}}" height="{{g.art}}" aria-hidden="true">
            <sc-if value="{{g.isQuiz}}" hint-placeholder-val="{{ false }}">
              <rect x="20" y="20" width="76" height="76" rx="14" fill="#FF4D6D"></rect><rect x="104" y="20" width="76" height="76" rx="14" fill="#22B8F0"></rect>
              <rect x="20" y="104" width="76" height="76" rx="14" fill="#FFB020"></rect><rect x="104" y="104" width="76" height="76" rx="14" fill="#2ECC71"></rect>
              <path d="M58 40 L80 78 L36 78 Z" fill="#14141E"></path><path d="M142 36 L162 58 L142 80 L122 58 Z" fill="#14141E"></path>
              <circle cx="58" cy="142" r="20" fill="#14141E"></circle><rect x="124" y="124" width="36" height="36" fill="#14141E"></rect>
            </sc-if>
            <sc-if value="{{g.isCurve}}" hint-placeholder-val="{{ false }}">
              <path d="M10 170 C60 40 110 180 150 80 S196 40 192 120" fill="none" stroke="#FF4D6D" stroke-width="12" stroke-linecap="round"></path>
              <path d="M16 30 C80 110 120 20 186 60" fill="none" stroke="#2ECC71" stroke-width="12" stroke-linecap="round"></path>
              <circle cx="192" cy="120" r="8" fill="#FFFFFF"></circle>
            </sc-if>
            <sc-if value="{{g.isWolf}}" hint-placeholder-val="{{ false }}">
              <circle cx="100" cy="88" r="70" fill="#F2E9C9"></circle>
              <path d="M40 190 L60 120 L72 92 L84 116 L100 108 L116 116 L128 92 L140 120 L160 190 Z" fill="#14141E"></path>
              <circle cx="88" cy="140" r="4" fill="#FFB020"></circle><circle cx="112" cy="140" r="4" fill="#FFB020"></circle>
            </sc-if>
          </svg>
        </div>
        <div style="font-size: {{g.fs}}; font-weight: 900">{{g.name}}</div>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; left: 96px; top: 760px; width: 560px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 18px; font-size: 40px; font-weight: 700; background: rgba(77,217,255,0.16); border-left: 0; border-radius: 14px; padding: 12px 20px; outline: 3px solid #4DD9FF">▶ Igraj</div>
    <div style="font-size: 36px; color: #C9C9D8; padding: 8px 20px">Način: Kaos</div>
    <div style="font-size: 36px; color: #C9C9D8; padding: 8px 20px">Pauza prije runde: 2 s</div>
    <div style="font-size: 36px; color: #C9C9D8; padding: 8px 20px">Kako se igra</div>
  </div>
  <div style="position: absolute; left: 760px; top: 780px; width: 900px; font-size: 34px; line-height: 1.4; color: #A9A9BC">Vozi svoju krivulju, kupi pojačanja i ne udari ni u koga. Zadnji živ dobiva bodove.<br><span style="color: #F4F4F8">Večeras: Ana 9 · Luka 7 · Ivana 6</span></div>
  <div style="position: absolute; left: 96px; right: 96px; bottom: 40px; display: flex; gap: 40px; font-size: 28px; color: #A9A9BC">
    <span>◀ ▶ igra</span><span>▲ ▼ izbor</span><span>OK potvrdi</span><span>Natrag izlaz</span>
    <span style="margin-left: auto">Luka bira i na mobitelu</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"wave1":{"editor":"color","default":"#4DD9FF"},"wave2":{"editor":"color","default":"#9B5CFF"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const tile = (big) => `width: ${big ? 420 : 260}px; height: ${big ? 420 : 260}px; border-radius: ${big ? 48 : 32}px; background: ${big ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.05)'}; display: flex; align-items: center; justify-content: center; box-sizing: border-box; ${big ? 'outline: 4px solid #4DD9FF; outline-offset: 6px; box-shadow: 0 0 80px rgba(77,217,255,0.35);' : ''}`;
    const g = (name, big, kind) => ({ name, tile: tile(big), art: big ? 300 : 180, fs: big ? '64px' : '40px', op: big ? 1 : 0.7, isQuiz: kind === 'q', isCurve: kind === 'c', isWolf: kind === 'w' });
    return {
      wave1: this.props.wave1 ?? '#4DD9FF', wave2: this.props.wave2 ?? '#9B5CFF', s56: 56,
      games: [g('Curve', true, 'c'), g('Kviz', false, 'q'), g('Vukodlak', false, 'w')],
      players: [
        { animal: 'fox', color: '#FF4D6D' }, { animal: 'owl', color: '#FFB020' }, { animal: 'frog', color: '#2ECC71' },
        { animal: 'rabbit', color: '#22B8F0' }, { animal: 'panda', color: '#9B5CFF' }
      ]
    };
  }
}
</script>
</body>
</html>
