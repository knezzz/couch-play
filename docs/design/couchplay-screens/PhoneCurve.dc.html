<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Curve controls</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 16px 32px; background: #14141E; color: #F4F4F8; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; gap: 10px; height: 48px">
    <dc-import name="Face" animal="owl" color="#FFB020" size="{{s40}}" hint-size="40px,40px"></dc-import>
    <span style="font-size: 20px; font-weight: 700; flex-grow: 1">Ana</span>
    <span style="font-size: 16px; color: #A9A9BC">Runda 3 · 12 bodova</span>
  </div>
  <div style="display: flex; gap: 12px; flex-grow: 1">
    <button aria-label="Lijevo" style="flex: 1 1 0; font: inherit; color: #14141E; background: #FFB020; border: 0; border-radius: 28px; display: flex; align-items: center; justify-content: center">
      <svg viewBox="0 0 64 64" width="96" height="96" aria-hidden="true"><path d="M40 12 L20 32 L40 52" fill="none" stroke="#14141E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <button aria-label="Desno" style="flex: 1 1 0; font: inherit; color: #14141E; background: #FFB020; border: 0; border-radius: 28px; display: flex; align-items: center; justify-content: center">
      <svg viewBox="0 0 64 64" width="96" height="96" aria-hidden="true"><path d="M24 12 L44 32 L24 52" fill="none" stroke="#14141E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
  </div>
  <div style="font-size: 15px; color: #A9A9BC; text-align: center; line-height: 1.4">Drži za skretanje. Kad te zahvati „Obrnuto”, lijevo i desno se zamijene: na TV-u uz tvoju liniju vidiš crvene strelice.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { s40: 40 }; }
}
</script>
</body>
</html>
