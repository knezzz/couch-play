<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Vukodlak settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 20px 28px; background: #14141E; color: #F4F4F8; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px">
  <div style="font-size: 18px; color: #4DD9FF; height: 40px; display: flex; align-items: center">‹ Natrag</div>
  <div style="font-size: 32px; font-weight: 900">Vukodlak</div>
  <div style="font-size: 16px; color: #A9A9BC">7 igrača</div>
  <a href="V2PhoneWolfRolesPick.dc.html" style="display: flex; align-items: center; gap: 12px; background: #1F1F2C; border-radius: 16px; padding: 14px 16px; color: #F4F4F8; text-decoration: none">
    <span style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
      <span style="font-size: 20px; font-weight: 700">Moguće uloge · 6 uključeno</span>
      <span style="font-size: 15px; color: #A9A9BC; line-height: 1.35">Vukodlak, Seljanin, Vidovnjakinja, Ljekarnik, Lovac, Travarica. Igra izvlači koje će biti.</span>
    </span>
    <span style="font-size: 24px; color: #4DD9FF">›</span>
  </a>
  <a href="V2PhoneRolesInfo.dc.html" style="display: flex; align-items: center; gap: 12px; background: #1F1F2C; border-radius: 16px; padding: 14px 16px; color: #F4F4F8; text-decoration: none">
    <span style="font-size: 18px; flex-grow: 1">Kako to vide igrači</span>
    <span style="font-size: 24px; color: #4DD9FF">›</span>
  </a>
  <div style="font-size: 16px; color: #A9A9BC; margin-top: 6px">Pravila</div>
  <button role="switch" aria-checked="{{hideOn}}" onClick="{{toggleHide}}" style="font: inherit; color: #F4F4F8; background: #1F1F2C; border: 0; border-radius: 16px; padding: 10px 12px 10px 16px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer; min-height: 76px">
    <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
      <span style="font-size: 19px; font-weight: 700">Skrivene uloge</span>
      <span style="font-size: 14px; color: #A9A9BC; line-height: 1.3">Kad netko ispadne, uloga se ne otkriva. Sve uloge se vide tek na kraju igre.</span>
    </span>
    <span style="{{hideTrack}}"><span style="{{hideKnob}}"></span></span>
  </button>
  <div style="display: flex; align-items: center; gap: 10px; background: #1F1F2C; border-radius: 16px; padding: 6px 6px 6px 16px">
    <span style="font-size: 19px; flex-grow: 1">Razgovor danju</span>
    <button aria-label="Kraće" style="font: inherit; font-size: 26px; font-weight: 700; color: #F4F4F8; background: #2A2A3A; border: 0; border-radius: 12px; width: 56px; height: 56px">−</button>
    <span style="font-size: 20px; font-weight: 700; width: 56px; text-align: center">2:00</span>
    <button aria-label="Duže" style="font: inherit; font-size: 26px; font-weight: 700; color: #F4F4F8; background: #2A2A3A; border: 0; border-radius: 12px; width: 56px; height: 56px">+</button>
  </div>
  <button style="font: inherit; font-size: 24px; font-weight: 900; color: #14141E; background: #4DD9FF; border: 0; border-radius: 18px; height: 64px; margin-top: auto">Igraj</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { hide: true }; }
  renderVals() {
    const on = this.state.hide;
    return {
      hideOn: on ? 'true' : 'false', toggleHide: () => this.setState({ hide: !on }),
      hideTrack: `flex: 0 0 56px; height: 32px; border-radius: 16px; background: ${on ? '#4DD9FF' : '#2A2A3A'}; display: flex; align-items: center; padding: 3px; box-sizing: border-box; justify-content: ${on ? 'flex-end' : 'flex-start'}`,
      hideKnob: `width: 26px; height: 26px; border-radius: 50%; background: ${on ? '#14141E' : '#A9A9BC'}`
    };
  }
}
</script>
</body>
</html>
