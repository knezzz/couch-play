<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Vukodlak settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 20px 28px; background: #14141E; color: #F4F4F8; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column; gap: 10px">
  <div style="font-size: 18px; color: #4DD9FF; height: 40px; display: flex; align-items: center">‹ Natrag</div>
  <div style="font-size: 32px; font-weight: 900">Vukodlak</div>
  <div style="font-size: 16px; color: #A9A9BC">Uloge u igri · 7 igrača</div>
  <div style="display: flex; align-items: center; gap: 10px; background: #1F1F2C; border-radius: 16px; padding: 6px 6px 6px 16px">
    <span style="font-size: 19px; flex-grow: 1">Vukodlaci</span>
    <button aria-label="Manje vukodlaka" onClick="{{lessW}}" style="font: inherit; font-size: 26px; font-weight: 700; color: #F4F4F8; background: #2A2A3A; border: 0; border-radius: 12px; width: 56px; height: 56px">−</button>
    <span style="font-size: 22px; font-weight: 700; width: 36px; text-align: center">{{wolves}}</span>
    <button aria-label="Više vukodlaka" onClick="{{moreW}}" style="font: inherit; font-size: 26px; font-weight: 700; color: #F4F4F8; background: #2A2A3A; border: 0; border-radius: 12px; width: 56px; height: 56px">+</button>
  </div>
  <sc-for list="{{roles}}" as="r" hint-placeholder-count="3">
    <button role="switch" aria-checked="{{r.on}}" onClick="{{r.toggle}}" style="font: inherit; color: #F4F4F8; background: #1F1F2C; border: 0; border-radius: 16px; padding: 10px 12px 10px 16px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer; min-height: 68px">
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <span style="font-size: 19px; font-weight: 700">{{r.name}}</span>
        <span style="font-size: 14px; color: #A9A9BC; line-height: 1.3">{{r.desc}}</span>
      </span>
      <span style="{{r.track}}"><span style="{{r.knob}}"></span></span>
    </button>
  </sc-for>
  <div style="font-size: 15px; color: #A9A9BC; padding: 0 4px">Seljana: {{villagers}} (ostali igrači)</div>
  <div style="font-size: 16px; color: #A9A9BC; margin-top: 6px">Pravila</div>
  <button role="switch" aria-checked="{{hideOn}}" onClick="{{toggleHide}}" style="font: inherit; color: #F4F4F8; background: #1F1F2C; border: 0; border-radius: 16px; padding: 10px 12px 10px 16px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer; min-height: 76px">
    <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
      <span style="font-size: 19px; font-weight: 700">Skrivene uloge</span>
      <span style="font-size: 14px; color: #A9A9BC; line-height: 1.3">Kad netko ispadne, uloga se ne otkriva. Sve uloge se vide tek na kraju igre.</span>
    </span>
    <span style="{{hideTrack}}"><span style="{{hideKnob}}"></span></span>
  </button>
  <div style="display: flex; align-items: center; gap: 10px; background: #1F1F2C; border-radius: 16px; padding: 6px 6px 6px 16px">
    <span style="font-size: 19px; flex-grow: 1">Razgovor danju</span>
    <button aria-label="Kraće" style="font: inherit; font-size: 26px; font-weight: 700; color: #F4F4F8; background: #2A2A3A; border: 0; border-radius: 12px; width: 56px; height: 56px">−</button>
    <span style="font-size: 20px; font-weight: 700; width: 56px; text-align: center">2:00</span>
    <button aria-label="Duže" style="font: inherit; font-size: 26px; font-weight: 700; color: #F4F4F8; background: #2A2A3A; border: 0; border-radius: 12px; width: 56px; height: 56px">+</button>
  </div>
  <button style="font: inherit; font-size: 24px; font-weight: 900; color: #14141E; background: #4DD9FF; border: 0; border-radius: 18px; height: 64px; margin-top: auto">Igraj</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { wolves: 2, seer: true, doc: true, hunter: false, hide: true }; }
  renderVals() {
    const s = this.state, players = 7;
    const sw = (on) => ({
      track: `flex: 0 0 56px; height: 32px; border-radius: 16px; background: ${on ? '#4DD9FF' : '#2A2A3A'}; display: flex; align-items: center; padding: 3px; box-sizing: border-box; justify-content: ${on ? 'flex-end' : 'flex-start'}`,
      knob: `width: 26px; height: 26px; border-radius: 50%; background: ${on ? '#14141E' : '#A9A9BC'}`
    });
    const role = (k, name, desc) => ({ name, desc, on: s[k] ? 'true' : 'false', toggle: () => this.setState({ [k]: !s[k] }), ...sw(s[k]) });
    const roles = [
      role('seer', 'Vidovnjakinja', 'Svake noći vidi ulogu jednog igrača.'),
      role('doc', 'Ljekarnik', 'Svake noći štiti jednog igrača.'),
      role('hunter', 'Lovac', 'Kad ispadne, odmah izbacuje još jednog igrača.')
    ];
    const special = ['seer', 'doc', 'hunter'].filter((k) => s[k]).length;
    const h = sw(s.hide);
    return {
      wolves: s.wolves, roles, villagers: Math.max(0, players - s.wolves - special),
      lessW: () => this.setState({ wolves: Math.max(1, s.wolves - 1) }),
      moreW: () => this.setState({ wolves: Math.min(3, s.wolves + 1) }),
      hideOn: s.hide ? 'true' : 'false', toggleHide: () => this.setState({ hide: !s.hide }),
      hideTrack: h.track, hideKnob: h.knob
    };
  }
}
</script>
</body>
</html>
