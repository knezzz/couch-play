<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Uljez on the TV</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes upulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.u-turn{animation:upulse 1.6s ease-in-out infinite;transform-origin:center}
@media (prefers-reduced-motion: reduce){.u-turn{animation:none}}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: radial-gradient(circle at 50% 55%, #2A1F3D 0%, #120E1E 70%); color: #F4F4F8; font-family: Roboto, system-ui, sans-serif">
  <div style="position: absolute; left: 72px; top: 56px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 32px; color: #C9A8FF; font-weight: 700; letter-spacing: 4px">{{kicker}}</div>
    <div style="font-size: 72px; font-weight: 900">{{headline}}</div>
  </div>
  <div style="position: absolute; right: 72px; top: 64px; text-align: right">
    <div style="font-size: 30px; color: #A9A9BC">{{clockLabel}}</div>
    <div style="font-size: 96px; font-weight: 900; line-height: 1">{{clock}}</div>
  </div>
  <svg style="position: absolute; left: 0; top: 0" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true">
    <ellipse cx="960" cy="600" rx="420" ry="230" fill="#3A2A55"></ellipse>
    <ellipse cx="960" cy="590" rx="400" ry="214" fill="#4A3670"></ellipse>
  </svg>
  <sc-for list="{{seats}}" as="p" hint-placeholder-count="6">
    <div style="{{p.box}}">
      <div class="{{p.cls}}" style="{{p.ring}}">
        <dc-import name="Face" animal="{{p.animal}}" color="{{p.color}}" size="{{s110}}" hint-size="110px,110px"></dc-import>
      </div>
      <span style="font-size: 34px; font-weight: 700">{{p.name}}</span>
      <span style="{{p.noteStyle}}">{{p.note}}</span>
    </div>
  </sc-for>
  <div style="position: absolute; left: 610px; top: 520px; width: 700px; text-align: center; display: flex; flex-direction: column; gap: 10px">
    <sc-if value="{{reveal}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; justify-content: center; gap: 28px">
        <div style="background: #F4F4F8; color: #14141E; border-radius: 20px; padding: 14px 28px"><div style="font-size: 24px; font-weight: 700">Riječ sela</div><div style="font-size: 52px; font-weight: 900">Spužva Bob</div></div>
        <div style="background: #FF4D6D; color: #14141E; border-radius: 20px; padding: 14px 28px"><div style="font-size: 24px; font-weight: 700">Uljezova riječ</div><div style="font-size: 52px; font-weight: 900">Pikachu</div></div>
      </div>
    </sc-if>
    <sc-if value="{{clues}}" hint-placeholder-val="{{ true }}">
      <div style="font-size: 40px; color: #E6DDF7">Svatko kaže jedan trag o svojoj riječi.<br>Ne reci riječ!</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stage":{"editor":"enum","options":["clues","reveal"],"default":"clues"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const stage = this.props.stage ?? 'clues', rev = stage === 'reveal';
    const people = [['Luka', 'fox', '#FF4D6D'], ['Ana', 'owl', '#FFB020'], ['Marko', 'frog', '#2ECC71'], ['Ivana', 'rabbit', '#22B8F0'], ['Petra', 'cat', '#9B5CFF'], ['Josip', 'bear', '#FF7AD9']];
    const cx = 960, cy = 590, rx = 560, ry = 320;
    const seats = people.map(([name, animal, color], i) => {
      const a = -Math.PI / 2 + (i * 2 * Math.PI) / people.length;
      const x = Math.round(cx + rx * Math.cos(a)), y = Math.round(cy + ry * Math.sin(a));
      const turn = !rev && i === 2, done = !rev && i < 2, imp = rev && name === 'Petra';
      return {
        name, animal, color,
        cls: turn ? 'u-turn' : '',
        box: `position: absolute; left: ${x - 120}px; top: ${y - 100}px; width: 240px; display: flex; flex-direction: column; align-items: center; gap: 6px`,
        ring: `width: 140px; height: 140px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #1E1830; ${turn ? 'outline: 6px solid #FFE27A; outline-offset: 4px;' : ''}${imp ? 'outline: 6px solid #FF4D6D; outline-offset: 4px;' : ''}`,
        note: rev ? (imp ? 'Uljez · 4 glasa' : (name === 'Luka' ? '1 glas' : '')) : (turn ? 'Sad ti!' : (done ? '✓ rekao trag' : '')),
        noteStyle: `font-size: 26px; font-weight: 700; color: ${turn ? '#FFE27A' : imp ? '#FF4D6D' : '#A9A9BC'}`
      };
    });
    return {
      seats, s110: 110, reveal: rev, clues: !rev,
      kicker: rev ? 'KRAJ RUNDE' : 'RUNDA 2 · TRAGOVI',
      headline: rev ? 'Uhvatili ste uljeza: Petra!' : 'Marko, reci trag.',
      clockLabel: rev ? 'Petra pogađa vašu riječ' : 'Za trag', clock: rev ? '0:15' : '0:12'
    };
  }
}
</script>
</body>
</html>
