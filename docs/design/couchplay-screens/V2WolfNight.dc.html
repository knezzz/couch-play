<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Vukodlak night</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: linear-gradient(180deg, #05060F 0%, #0C1430 70%, #101A3A 100%); color: #F4F4F8; font-family: Roboto, system-ui, sans-serif">
  <svg style="position: absolute; left: 0; top: 0" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true">
    <circle cx="1560" cy="220" r="120" fill="#F2E9C9"></circle>
    <circle cx="1600" cy="190" r="22" fill="#E2D7B0"></circle><circle cx="1520" cy="260" r="14" fill="#E2D7B0"></circle>
    <circle cx="200" cy="120" r="3" fill="#FFFFFF"></circle><circle cx="420" cy="80" r="2" fill="#FFFFFF"></circle><circle cx="760" cy="150" r="3" fill="#FFFFFF"></circle><circle cx="1100" cy="70" r="2" fill="#FFFFFF"></circle><circle cx="1260" cy="300" r="2" fill="#FFFFFF"></circle><circle cx="980" cy="260" r="2" fill="#FFFFFF"></circle>
    <path d="M0 880 L120 800 L180 840 L260 760 L340 830 L420 790 L520 860 L640 780 L760 850 L900 770 L1020 840 L1160 790 L1300 860 L1440 780 L1580 840 L1720 790 L1920 850 L1920 1080 L0 1080 Z" fill="#070A18"></path>
  </svg>
  <div style="position: absolute; left: 96px; top: 80px; display: flex; flex-direction: column; gap: 16px">
    <div style="font-size: 36px; color: #8FA0D8; font-weight: 700; letter-spacing: 4px">NOĆ 2</div>
    <div style="font-size: 96px; font-weight: 900; line-height: 1.05">Selo spava.</div>
    <div style="font-size: 44px; color: #C3CBEA; width: 1100px; line-height: 1.3">Svi gledaju svoje mobitele. Netko u selu nije ono što se čini.</div>
  </div>
  <div style="position: absolute; left: 96px; right: 96px; bottom: 120px; display: flex; gap: 40px; justify-content: center">
    <sc-for list="{{players}}" as="p" hint-placeholder-count="7">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; opacity: {{p.op}}">
        <div style="width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center">
          <dc-import name="Face" animal="{{p.animal}}" color="{{p.color}}" size="{{s120}}" hint-size="120px,120px"></dc-import>
        </div>
        <span style="font-size: 36px; font-weight: 700">{{p.name}}</span>
        <span style="font-size: 26px; color: #8FA0D8">{{p.note}}</span>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; right: 96px; top: 400px; font-size: 34px; color: #8FA0D8; text-align: right; line-height: 1.5">Noćne odluke: 4 od 6<br>Jutro za 0:21</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const p = (animal, color, name, out) => ({ animal, color, name, op: out ? 0.3 : 0.85, note: out ? 'ispao' : 'spava' });
    return {
      s120: 120,
      players: [p('fox', '#FF4D6D', 'Luka'), p('owl', '#FFB020', 'Ana'), p('frog', '#2ECC71', 'Marko', true), p('rabbit', '#22B8F0', 'Ivana'), p('cat', '#9B5CFF', 'Petra'), p('bear', '#FF7AD9', 'Josip'), p('mouse', '#F5E94B', 'Maja')]
    };
  }
}
</script>
</body>
</html>
