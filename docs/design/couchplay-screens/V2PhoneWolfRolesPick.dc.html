<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Host picks Vukodlak roles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 0 24px; background: #14141E; color: #F4F4F8; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column; gap: 8px">
  <a href="V2PhoneWolfSettings.dc.html" style="margin: 0 20px; align-self: flex-start; font-size: 18px; color: #4DD9FF; text-decoration: none; height: 40px; display: flex; align-items: center">‹ Vukodlak</a>
  <div style="margin: 0 20px; font-size: 28px; font-weight: 900">Uloge u igri</div>
  <div style="margin: 0 20px; font-size: 16px; color: {{sumColor}}">{{summary}}</div>
  <div style="flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 0 20px">
    <dc-import name="WolfRoles" mode="edit" on-change="{{changed}}" hint-size="350px,1400px"></dc-import>
  </div>
  <button style="margin: 0 20px; font: inherit; font-size: 22px; font-weight: 900; color: #14141E; background: {{saveBg}}; border: 0; border-radius: 16px; height: 60px">Spremi</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { total: 7 }; }
  renderVals() {
    const players = 7, t = this.state.total, ok = t === players;
    return {
      changed: (c) => this.setState({ total: Object.values(c).reduce((a, b) => a + b, 0) }),
      summary: ok ? `${t} uloga za ${players} igrača ✓` : `${t} uloga za ${players} igrača. Treba točno ${players}.`,
      sumColor: ok ? '#7FD8A8' : '#FF7A8F',
      saveBg: ok ? '#4DD9FF' : '#2A2A3A'
    };
  }
}
</script>
</body>
</html>
