<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV quiz question</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 56px 96px 72px; background: #14141E; color: #F4F4F8; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
  <div style="display: flex; align-items: center; gap: 32px; font-size: 40px; color: #A9A9BC">
    <span style="font-weight: 700; color: #F4F4F8">Question 3 of 10</span>
    <span style="flex-grow: 1">World Flags</span>
    <span>3 of 4 answered</span>
  </div>
  <div style="height: 16px; background: #2A2A3A; border-radius: 999px; overflow: hidden">
    <div style="width: 62%; height: 16px; background: #4DD9FF; border-radius: 999px"></div>
  </div>
  <div style="display: flex; align-items: center; gap: 64px; flex-grow: 1">
    <div style="flex-grow: 1; font-size: 80px; font-weight: 900; line-height: 1.1; letter-spacing: -1px">Which country’s flag is this?</div>
    <div style="width: 520px; height: 347px; flex-shrink: 0; border-radius: 16px; overflow: hidden; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="520" height="347" viewBox="0 0 3 2" role="img" aria-label="Flag of Japan"><rect width="3" height="2" fill="#FFFFFF"></rect><circle cx="1.5" cy="1" r="0.6" fill="#BC002D"></circle></svg>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
    <div style="height: 168px; box-sizing: border-box; background: #FF4D6D; color: #14141E; border-radius: 24px; padding: 0 40px; display: flex; align-items: center; gap: 32px"><span style="font-size: 64px">▲</span><span style="font-size: 52px; font-weight: 700; line-height: 1.1">Japan</span></div>
    <div style="height: 168px; box-sizing: border-box; background: #22B8F0; color: #14141E; border-radius: 24px; padding: 0 40px; display: flex; align-items: center; gap: 32px"><span style="font-size: 64px">◆</span><span style="font-size: 52px; font-weight: 700; line-height: 1.1">Bangladesh</span></div>
    <div style="height: 168px; box-sizing: border-box; background: #FFB020; color: #14141E; border-radius: 24px; padding: 0 40px; display: flex; align-items: center; gap: 32px"><span style="font-size: 64px">●</span><span style="font-size: 52px; font-weight: 700; line-height: 1.1">Palau</span></div>
    <div style="height: 168px; box-sizing: border-box; background: #2ECC71; color: #14141E; border-radius: 24px; padding: 0 40px; display: flex; align-items: center; gap: 32px"><span style="font-size: 64px">■</span><span style="font-size: 40px; font-weight: 700; line-height: 1.1">The Democratic Republic of São Tomé and Príncipe (long answers wrap to 3 lines, down to 28 px)</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
