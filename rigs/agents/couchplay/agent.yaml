name: couchplay
version: "1.0"
description: CouchPlay team member. The profile sets the skills, the rig member's startup file sets the role.

defaults:
  runtime: claude-code

# shortcut: absolute path to the global npm install, change it if OpenRig moves.
imports:
  - ref: path:/usr/local/lib/node_modules/@openrig/cli/daemon/specs/agents/shared

profiles:
  lead:
    uses:
      skills: [orchestration-team, systematic-debugging, verification-before-completion]
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:claude-activity-hooks]
  builder:
    uses:
      skills: [development-team, test-driven-development, systematic-debugging, verification-before-completion]
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:claude-activity-hooks]
  reviewer:
    uses:
      skills: [review-team, systematic-debugging, verification-before-completion]
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:claude-activity-hooks]

resources: {}

startup:
  files: []
  actions: []
