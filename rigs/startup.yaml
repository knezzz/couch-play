version: "0.2"
name: couchplay
culture_file: STARTUP-CULTURE.md
summary: >
  CouchPlay build team: a product manager who owns the plan and the team's size, a tech lead, a core engineer
  (Dart logic, server, session), an app engineer (TV and controller UI, Flame), QA and a code reviewer. Opus for PM,
  lead and review; Sonnet elsewhere. The PM can add seats from rigs/seats/ when the plan needs more hands.

pods:
  - id: product
    label: Product
    members:
      - id: pm
        role: product-manager
        model: claude-opus-5-5
        effort: medium
        agent_ref: local:agents/couchplay
        profile: lead
        runtime: claude-code
        cwd: ..
        claude_permissions:
          deny:
            - Bash(git push --force*)
            - Bash(git push -f*)
            - Bash(git reset --hard*)
            - Bash(git add -A*)
            - Bash(git add .)
            - Bash(git commit -a*)
        startup:
          files:
            - path: roles/product-manager.md
              delivery_hint: send_text
              required: true
    edges: []

  - id: build
    label: Build
    members:
      - id: lead
        role: tech-lead
        model: claude-opus-5-5
        effort: medium
        agent_ref: local:agents/couchplay
        profile: lead
        runtime: claude-code
        cwd: ..
        claude_permissions:
          deny:
            - Bash(git push --force*)
            - Bash(git push -f*)
            - Bash(git reset --hard*)
            - Bash(git add -A*)
            - Bash(git add .)
            - Bash(git commit -a*)
        startup:
          files:
            - path: roles/tech-lead.md
              delivery_hint: send_text
              required: true
      - id: core
        role: core-engineer
        model: claude-sonnet-5-5
        effort: medium
        agent_ref: local:agents/couchplay
        profile: builder
        runtime: claude-code
        cwd: ..
        claude_permissions:
          deny:
            - Bash(git push --force*)
            - Bash(git push -f*)
            - Bash(git reset --hard*)
            - Bash(git add -A*)
            - Bash(git add .)
            - Bash(git commit -a*)
        startup:
          files:
            - path: roles/core-engineer.md
              delivery_hint: send_text
              required: true
      - id: app
        role: app-engineer
        model: claude-sonnet-5-5
        effort: medium
        agent_ref: local:agents/couchplay
        profile: builder
        runtime: claude-code
        cwd: ..
        claude_permissions:
          deny:
            - Bash(git push --force*)
            - Bash(git push -f*)
            - Bash(git reset --hard*)
            - Bash(git add -A*)
            - Bash(git add .)
            - Bash(git commit -a*)
        startup:
          files:
            - path: roles/app-engineer.md
              delivery_hint: send_text
              required: true
    edges:
      - kind: delegates_to
        from: lead
        to: core
      - kind: delegates_to
        from: lead
        to: app
      - kind: collaborates_with
        from: core
        to: app

  - id: check
    label: Checks
    members:
      - id: qa
        role: qa-engineer
        model: claude-sonnet-5-5
        effort: low
        agent_ref: local:agents/couchplay
        profile: builder
        runtime: claude-code
        cwd: ..
        claude_permissions:
          deny:
            - Bash(git push --force*)
            - Bash(git push -f*)
            - Bash(git reset --hard*)
            - Bash(git add -A*)
            - Bash(git add .)
            - Bash(git commit -a*)
        startup:
          files:
            - path: roles/qa-engineer.md
              delivery_hint: send_text
              required: true
      - id: review
        role: code-reviewer
        model: claude-opus-5-5
        effort: high
        agent_ref: local:agents/couchplay
        profile: reviewer
        runtime: claude-code
        cwd: ..
        claude_permissions:
          deny:
            - Bash(git push --force*)
            - Bash(git push -f*)
            - Bash(git reset --hard*)
            - Bash(git add -A*)
            - Bash(git add .)
            - Bash(git commit -a*)
        startup:
          files:
            - path: roles/code-reviewer.md
              delivery_hint: send_text
              required: true
    edges: []

edges:
  - { kind: delegates_to, from: product.pm, to: build.lead }
  - { kind: delegates_to, from: build.lead, to: check.qa }
  - { kind: delegates_to, from: build.lead, to: check.review }
  - { kind: can_observe, from: check.review, to: build.core }
  - { kind: can_observe, from: check.review, to: build.app }
  - { kind: can_observe, from: check.qa, to: build.app }
